    <rect x="194" y="360" width="16" height="10" rx="3" fill="#ffffff"/>
    <rect x="166" y="378" width="28" height="6" rx="3" fill="#ffffff"/>
  </g>

  <!-- Plus -->
  <g fill="#111111">
    <rect x="258" y="360" width="44" height="14" rx="3"/>
    <rect x="273" y="345" width="14" height="44" rx="3"/>
  </g>

  <!-- Phone -->
  <g>
    <rect x="344" y="322" width="60" height="96" rx="12" fill="#111111"/>
