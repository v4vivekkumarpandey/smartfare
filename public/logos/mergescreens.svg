<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="540" height="460" role="img" aria-label="MergeScreens logo">
  <rect width="540" height="460" fill="#ffffff"/>
  <g fill="#111111" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="270" y="160" font-size="115" letter-spacing="4">MERGE</text>
    <text x="270" y="272" font-size="104" letter-spacing="4">SCREENS</text>
  </g>
  <line x1="120" y1="300" x2="420" y2="300" stroke="#111111" stroke-width="6" stroke-linecap="round"/>

  <!-- Car (front view) -->
